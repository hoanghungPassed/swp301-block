# Cấu hình dành riêng cho test — đè lên src/main/resources/db.properties vì
# target/test-classes đứng trước target/classes trong classpath khi chạy test.
#
# Test dùng một database RIÊNG. Bộ test xoá và dựng lại toàn bộ bảng trước khi chạy,
# nên trỏ vào database đang phát triển sẽ mất sạch dữ liệu đang thử tay.
db.url=jdbc:sqlserver://localhost:1433;databaseName=FastFoodPreorder_Test;encrypt=true;trustServerCertificate=true
db.username=sa
db.password=FastFood@123
db.driver=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Pool nhỏ: test chạy tuần tự, giữ nhiều kết nối chỉ làm chậm lúc dựng lại schema.
db.pool.maximumPoolSize=8
db.pool.minimumIdle=1
db.pool.connectionTimeout=15000
db.pool.idleTimeout=60000
