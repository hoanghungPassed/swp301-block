# =========================================================
# Tham số nghiệp vụ - Baseline V6 (mục 18 - Quyết định đã khóa)
# =========================================================

# BR-05: pickup_time tối thiểu 30 phút sau checkout
business.pickup.minLeadMinutes=30

# BR-08: kitchen_release_at = pickup_time - 20 phút
business.kitchen.prepLeadMinutes=20

# BR-13: Online PENDING_PAYMENT không PAID trong 15 phút -> EXPIRED
business.payment.expiryMinutes=15

# BR-17: READY quá pickup_time + 30 phút -> UI flag OVERDUE (không auto cancel)
business.pickup.overdueMinutes=30

# Pickup Code (UC-15)
business.pickupCode.length=6

# Giờ mở cửa. Khách chỉ hẹn giờ lấy hàng trong khung này, và giờ hẹn sớm nhất còn phải
# lùi thêm prepLeadMinutes để đơn không bị đẩy xuống bếp trước lúc mở cửa.
business.store.openHour=7
business.store.closeHour=21

# =========================================================
# Scheduler (NFR-03: release trong vòng 60s kể từ kitchen_release_at)
# =========================================================
scheduler.kitchenRelease.intervalSeconds=30
scheduler.paymentExpiry.intervalSeconds=60

# =========================================================
# Payment Gateway (adapter - mục 12)
#
# Hai cổng, chọn bằng đúng dòng payment.gateway.provider:
#   VNPAY - cổng thanh toán chuyển hướng. Khách được đẩy sang trang của VNPAY, chọn ngân hàng
#           hoặc thẻ, trả tiền ở bên đó rồi được đưa ngược về đây kèm kết quả có chữ ký.
#           Mặc định, và đang trỏ vào máy chủ THỬ NGHIỆM (sandbox) nên không có tiền thật
#           chuyển đi — xem khối payment.vnpay.* bên dưới.
#   SEPAY - chuyển khoản thật qua mã VietQR. Xem khối payment.sepay.* bên dưới.
#
# Không còn cổng giả lập trong ứng dụng nữa. Nó từng có nút "thành công" bấm là đơn thành đã
# trả, tiện lúc trình bày nhưng cũng có nghĩa bất kỳ ai đăng nhập được cũng tự cho đơn của
# mình là đã trả tiền — và không có gì bảo đảm luồng thật chạy đúng, vì luồng thật chưa từng
# được chạy. Sandbox VNPAY thay được cả hai việc đó: vẫn không mất tiền thật, mà đường đi thì
# đúng đường sẽ chạy lúc lên thật.
# =========================================================
payment.gateway.provider=VNPAY

# =========================================================
# VNPAY (https://vnpay.vn) — chỉ có tác dụng khi provider=VNPAY
#
# tmnCode và hashSecret lấy trong cổng quản trị merchant. hashSecret là chuỗi bí mật dùng để
# ký, KHÔNG bao giờ gửi lên đường truyền: mình ký gói tham số bằng nó trước khi đẩy khách đi,
# và ký lại gói VNPAY gửi về để biết gói đó không bị ai sửa dọc đường. Sai hashSecret thì mọi
# lần trả tiền đều bị từ chối với "Dữ liệu thanh toán không hợp lệ" — đó là chỗ đầu tiên nên
# ngó khi thấy lỗi này.
#
# Cặp mã dưới đây là mã SANDBOX, dùng để chạy thử. Lên thật thì thay cả hai, và đổi payUrl
# sang https://vnpayment.vn/paymentv2/vpcpay.html (bỏ chữ "sandbox.").
#
# returnUrl để TRỐNG thì hệ thống tự dựng từ địa chỉ khách đang truy cập
# (ví dụ http://localhost:8080/fastfood/payment/vnpay/return). Chỉ điền khi máy chủ nằm sau
# proxy và tự nó không biết tên miền thật bên ngoài.
#
# VNPAY báo kết quả qua HAI đường và cả hai cùng đổ vào PaymentService.handleCallback:
#   /payment/vnpay/return - khách quay lại bằng trình duyệt. Luôn chạy được, kể cả trên máy cá
#                           nhân không có địa chỉ công khai. Nhưng khách đóng tab giữa chừng
#                           thì nó không bao giờ chạy.
#   /payment/vnpay/ipn    - VNPAY gọi thẳng vào máy chủ, không qua trình duyệt. Đây mới là
#                           đường chắc chắn tới, nhưng đòi máy chủ có địa chỉ công khai và
#                           phải khai báo trong cổng quản trị VNPAY.
# Bật cả hai không thu tiền hai lần: lần thứ hai đụng ràng buộc duy nhất trên mã giao dịch và
# bị bỏ qua (NFR-06).
#
# Số tiền gửi sang VNPAY tính bằng đồng NHÂN 100 và không có phần thập phân — VnPayGateway lo
# việc này, ghi ra đây vì nó là chỗ sai kinh điển khi đọc nhật ký thấy số tiền gấp trăm lần.
# =========================================================
payment.vnpay.tmnCode=GRYKOOR0
payment.vnpay.hashSecret=KXZIBIJSFRAMEJCRSSRYAKBVIEGFLXLH
payment.vnpay.payUrl=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
payment.vnpay.returnUrl=

# =========================================================
# Notification (ORDER_CONFIRMED / ORDER_READY - module 6)
#
# Hai kênh, chọn bằng đúng dòng notification.channel:
#   MOCK  - thư chỉ ghi ra log máy chủ. Mặc định, vì máy chạy demo không có SMTP và mất mạng
#           giữa buổi bảo vệ thì mọi luồng vẫn đi hết được: mở catalina.out là thấy liên kết
#           xác thực và liên kết đặt lại mật khẩu, bấm vào chạy tiếp bình thường.
#   SMTP  - gửi thư thật. Chỉ lúc này chức năng "quên mật khẩu" và "xác thực email" mới đúng
#           nghĩa, vì cả hai dựa trên việc chỉ chủ hộp thư đọc được liên kết.
#
# Gmail: password phải là App Password 16 ký tự tạo riêng cho ứng dụng, mật khẩu đăng nhập
# thường đã bị chặn cho SMTP từ lâu. Thiếu username/password mà vẫn đặt SMTP thì hệ thống tự
# quay về MOCK và ghi một dòng SEVERE — xem NotificationSenders.
#
# from để trống thì lấy luôn username: phần lớn máy chủ SMTP từ chối gửi thư mang địa chỉ
# người gửi khác với tài khoản đang đăng nhập.
# =========================================================
notification.channel=MOCK
notification.mail.host=smtp.gmail.com
notification.mail.port=587
notification.mail.username=
notification.mail.password=
notification.mail.from=
notification.mail.fromName=Fast Food Pre-order

# =========================================================
# KDS realtime (NFR-04: item xuất hiện trên KDS trong 2 giây)
# =========================================================
kds.poll.intervalMillis=2000

# =========================================================
# Xác thực và phiên đăng nhập (xem docs/STRUCTURE.md mục 5)
#
# Mọi giá trị ở đây đều có mặc định trong mã, nên xoá cả khối này ứng dụng vẫn chạy đúng
# như cũ. Chúng nằm ngoài file để chỉnh được lúc trình bày mà không phải dịch lại.
# =========================================================

# Bao lâu soi lại tài khoản trong cơ sở dữ liệu một lần, để việc khoá hay hạ quyền có hiệu
# lực ngay thay vì đợi hết phiên. Yêu cầu GHI thì luôn soi lại, không đợi hết nhịp này.
security.session.revalidateSeconds=30

# Chống dò mật khẩu. Đếm theo cặp email + địa chỉ máy, không đếm theo mình email — đếm theo
# email thì bất kỳ ai cũng khoá được tài khoản người khác bằng cách gõ sai vài lần.
security.login.maxAttempts=5
security.login.lockMinutes=15
security.login.windowMinutes=15

# Luồng quên mật khẩu. Hạn ngắn để một liên kết bị lộ không nằm chờ được lâu; số lần xin
# có trần để chức năng này không thành công cụ dội thư vào hộp thư người khác.
security.reset.expiryMinutes=15
security.reset.maxRequests=3
security.reset.windowMinutes=15

# Thư xác thực địa chỉ email lúc đăng ký. Hạn tính bằng GIỜ chứ không phải phút, và dài hơn
# hẳn liên kết đặt lại mật khẩu: người quên mật khẩu đang ngồi chờ ngay đó, còn thư xác thực
# thì người ta hay để đến tối mới mở hộp thư. Mã này cũng chỉ bật được một cờ chứ không mở
# được đường vào tài khoản, nên nằm lâu ít đáng ngại hơn.
security.verify.expiryHours=24
security.verify.maxRequests=5
security.verify.windowMinutes=15
